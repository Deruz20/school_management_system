version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nova_postgres
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_password
      POSTGRES_DB: nova_db
    ports:
      - "5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nova_pgdata:
